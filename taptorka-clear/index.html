<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Оставить отзыв | TapTorka</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f1013 0%, #16181d 50%, #0d0e11 100%);
      --card-bg: rgba(26, 28, 33, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --btn-bg: #32353d;
      --btn-bg-hover: #3f434d;
      --btn-bg-active: #4a4e5a;
      --btn-border: rgba(255, 255, 255, 0.15);
      --text-main: #f0f1f5;
      --text-muted: #9aa0a6;
      --star-gold: #ffd700;
      --heart-red: #ff3b30;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
      padding: 20px;
      padding-top: calc(20px + env(safe-area-inset-top));
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
    }

    .container {
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 36px 24px 28px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                  inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    /* АНИМИРОВАННЫЙ ВЕКТОРНЫЙ ЛОГОТИП TAPTORKA */
    .logo-box {
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.6));
      animation: logoAppear 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .logo-box svg {
      width: 100%;
      height: 100%;
    }

    @keyframes logoAppear {
      0% {
        opacity: 0;
        transform: scale(0.8) translateY(-10px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .title {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    /* СЕРДЦЕ С ДВОЙНЫМ УДАРОМ ПРИ ЗАГРУЗКЕ */
    .heart-icon {
      margin-bottom: 18px;
      display: inline-block;
      animation: heartbeat 1.2s cubic-bezier(0.215, 0.61, 0.355, 1) 2 forwards;
    }

    .heart-icon svg {
      fill: var(--heart-red);
      filter: drop-shadow(0 0 10px rgba(255, 59, 48, 0.4));
    }

    @keyframes heartbeat {
      0% { transform: scale(1); }
      14% { transform: scale(1.22); }
      28% { transform: scale(1); }
      42% { transform: scale(1.18); }
      70% { transform: scale(1); }
      100% { transform: scale(1); }
    }

    .subtitle {
      font-size: 15px;
      color: var(--text-muted);
      font-weight: 400;
      line-height: 1.4;
      margin-bottom: 14px;
    }

    /* ЗОЛОТЫЕ ЗВЕЗДЫ С ВОЛНОЙ */
    .stars-box {
      display: flex;
      gap: 6px;
      margin-bottom: 28px;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 20px;
      transition: background 0.2s ease;
    }

    .stars-box:active {
      background: rgba(255, 255, 255, 0.05);
    }

    .star {
      color: var(--star-gold);
      font-size: 22px;
      display: inline-block;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
      animation: starWave 1.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    .star:nth-child(1) { animation-delay: 0.1s; }
    .star:nth-child(2) { animation-delay: 0.2s; }
    .star:nth-child(3) { animation-delay: 0.3s; }
    .star:nth-child(4) { animation-delay: 0.4s; }
    .star:nth-child(5) { animation-delay: 0.5s; }

    @keyframes starWave {
      0% { transform: translateY(0); filter: brightness(1); }
      30% { transform: translateY(-8px) scale(1.2); filter: brightness(1.5); }
      60% { transform: translateY(0) scale(1); filter: brightness(1); }
      100% { transform: translateY(0); filter: brightness(1); }
    }

    /* КНОПКИ ДЛЯ СМАРТФОНОВ */
    .links-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 32px;
    }

    .btn-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 16px 20px;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 18px;
      color: var(--text-main);
      text-decoration: none;
      font-weight: 500;
      font-size: 16px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
    }

    .btn-link:hover {
      background: var(--btn-bg-hover);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    .btn-link:active {
      background: var(--btn-bg-active);
      transform: scale(0.98);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .btn-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .platform-icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .arrow-icon {
      color: var(--text-muted);
      font-size: 14px;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .btn-link:hover .arrow-icon {
      color: var(--text-main);
      transform: translateX(2px) translateY(-2px);
    }

    /* АККУРАТНЫЙ ФУТЕР В ОДНУ СТРОКУ СО ССЫЛКОЙ НА TG */
    .footer {
      font-size: 13px;
      color: #7a7f8a;
      letter-spacing: 0.03em;
      font-weight: 400;
    }

    .footer a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer a:hover {
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- АНИМИРОВАННЫЙ ВЕКТОРНЫЙ ЛОГОТИП TAPTORKA -->
    <div class="logo-box">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="t-left-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="30%" stop-color="#cfd3da"/>
            <stop offset="70%" stop-color="#8a8f98"/>
            <stop offset="100%" stop-color="#4d5056"/>
          </linearGradient>
          <linearGradient id="t-right-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#e3e6ec"/>
            <stop offset="40%" stop-color="#9aa0a8"/>
            <stop offset="80%" stop-color="#5f636a"/>
            <stop offset="100%" stop-color="#35383e"/>
          </linearGradient>
          <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
          </filter>
        </defs>
        
        <g filter="url(#shadow)">
          <!-- Левая деталь: отзеркаленная Г -->
          <path d="M 14 18 
                   H 48 
                   V 82 
                   H 30 
                   V 36 
                   H 14 
                   Z" 
                fill="url(#t-left-grad)" 
                stroke="rgba(255,255,255,0.35)" 
                stroke-width="0.75" />

          <!-- Правая верхушка Г со срезом -->
          <path d="M 52 36 
                   L 70 18 
                   H 86 
                   V 36 
                   H 52 
                   Z" 
                fill="url(#t-right-grad)" 
                stroke="rgba(255,255,255,0.25)" 
                stroke-width="0.75" />

          <!-- Отпиленный нижний столбик правой Г -->
          <path d="M 52 46 
                   H 68 
                   V 82 
                   H 52 
                   Z" 
                fill="url(#t-right-grad)" 
                stroke="rgba(255,255,255,0.25)" 
                stroke-width="0.75" />
        </g>
      </svg>
    </div>

    <h1 class="title" id="biz-title">Спасибо,<br>что вы с нами</h1>

    <!-- СЕРДЦЕ -->
    <div class="heart-icon">
      <svg width="28" height="28" viewBox="0 0 24 24">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
    </div>

    <p class="subtitle" id="biz-subtitle">Выберите, где<br>оставить отзыв</p>

    <!-- ЗВЕЗДЫ -->
    <div class="stars-box" id="stars-container">
      <span class="star">★</span>
      <span class="star">★</span>
      <span class="star">★</span>
      <span class="star">★</span>
      <span class="star">★</span>
    </div>

    <!-- КНОПКИ -->
    <div class="links-container">
      <a href="#" id="yandex-btn" class="btn-link" target="_blank" rel="noopener">
        <div class="btn-content">
          <div class="platform-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#fc3f1d">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/>
            </svg>
          </div>
          <span>Яндекс Карты</span>
        </div>
        <span class="arrow-icon">↗</span>
      </a>

      <a href="#" id="2gis-btn" class="btn-link" target="_blank" rel="noopener">
        <div class="btn-content">
          <div class="platform-icon">
            <svg width="20" height="20" viewBox="0 0 24 24">
              <rect width="24" height="24" rx="5" fill="#24b800"/>
              <circle cx="12" cy="12" r="5" fill="#ffffff"/>
            </svg>
          </div>
          <span>2ГИС</span>
        </div>
        <span class="arrow-icon">↗</span>
      </a>
    </div>

    <!-- КЛИКАБЕЛЬНЫЙ ФУТЕР -->
    <div class="footer">
      by TapTorka &bull; Tg: <a href="https://t.me/torka001" target="_blank" rel="noopener">@torka001</a>
    </div>
  </div>

  <script>
    // БАЗА ДАННЫХ КЛИЕНТОВ
    const CLIENTS = {
      'rest_01': {
        name: "Спасибо,<br>что вы с нами",
        subtitle: "Выберите, где<br>оставить отзыв",
        yandex: 'https://yandex.ru/maps/org/sample',
        gis: 'https://2gis.ru/firm/sample'
      },
      'barber': {
        name: "Барбершоп TOP",
        subtitle: "Спасибо за визит!<br>Оцените нашу стрижку",
        yandex: 'https://yandex.ru/maps/',
        gis: 'https://2gis.ru/'
      }
    };

    // Читаем параметр ?id= или ?client= из ссылки
    const urlParams = new URLSearchParams(window.location.search);
    const clientId = urlParams.get('id') || urlParams.get('client');

    if (clientId && CLIENTS[clientId]) {
      const client = CLIENTS[clientId];
      document.getElementById('biz-title').innerHTML = client.name;
      document.getElementById('biz-subtitle').innerHTML = client.subtitle;
      document.getElementById('yandex-btn').href = client.yandex;
      document.getElementById('2gis-btn').href = client.gis;
    }

    // Перезапуск анимации звёзд при клике/тапе
    const starsContainer = document.getElementById('stars-container');
    const stars = starsContainer.querySelectorAll('.star');

    starsContainer.addEventListener('click', () => {
      stars.forEach(star => {
        star.style.animation = 'none';
        star.offsetHeight;
        star.style.animation = '';
      });
    });
  </script>
</body>
</html>
