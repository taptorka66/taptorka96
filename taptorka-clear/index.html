<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оставить отзыв | TapTorka</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0f0f0f;
      color: #f3f3f3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .logo {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
      color: #ffffff;
    }
    .subtitle {
      font-size: 12px;
      color: #888888;
      margin-bottom: 30px;
    }
    .business-title {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .business-desc {
      font-size: 14px;
      color: #aaaaaa;
      margin-bottom: 30px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      margin-bottom: 15px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-yandex {
      background-color: #fc3f1d;
      color: #ffffff;
    }
    .btn-2gis {
      background-color: #2add6b;
      color: #000000;
    }
    .footer {
      margin-top: 40px;
      font-size: 11px;
      color: #555555;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">TapTorka</div>
    <div class="subtitle">Быстрый переход к отзывам</div>

    <h1 id="b-title" class="business-title">Загрузка...</h1>
    <p id="b-desc" class="business-desc">Пожалуйста, выберите удобный сервис для оценки</p>

    <a id="btn-yandex" href="#" class="btn btn-yandex" style="display: none;">Оставить отзыв на Яндекс Картах</a>
    <a id="btn-2gis" href="#" class="btn btn-2gis" style="display: none;">Оставить отзыв в 2GIS</a>

    <div class="footer">
      By TapTorka<br>
      Tg: torka001
    </div>
  </div>

  <script>
    const clients = {
      "coffee": {
        name: "Кофейня «У Дома»",
        desc: "Оцените наш кофе и сервис",
        yandex: "https://yandex.ru/maps/",
        twogis: "https://2gis.ru/"
      },
      "barber": {
        name: "Барбершоп TOP",
        desc: "Спасибо, что выбрали нашу стрижку!",
        yandex: "https://yandex.ru/maps/",
        twogis: "https://2gis.ru/"
      }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const clientId = urlParams.get('client');

    const titleEl = document.getElementById('b-title');
    const descEl = document.getElementById('b-desc');
    const yandexBtn = document.getElementById('btn-yandex');
    const twogisBtn = document.getElementById('btn-2gis');

    if (clientId && clients[clientId]) {
      const currentClient = clients[clientId];
      
      titleEl.textContent = currentClient.name;
      descEl.textContent = currentClient.desc;

      if (currentClient.yandex) {
        yandexBtn.href = currentClient.yandex;
        yandexBtn.style.display = 'block';
      }
      if (currentClient.twogis) {
        twogisBtn.href = currentClient.twogis;
        twogisBtn.style.display = 'block';
      }
    } else {
      titleEl.textContent = "Бизнес не найден";
      descEl.textContent = "Проверьте правильность ссылки на NFC-карте.";
    }
  </script>

</body>
</html>
